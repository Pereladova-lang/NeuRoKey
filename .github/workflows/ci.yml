name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neurokey-pilot
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neurokey
          POSTGRES_PASSWORD: neurokey_dev
          POSTGRES_DB: neurokey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurokey"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://neurokey:neurokey_dev@localhost:5432/neurokey"
      AUTH_SECRET: "ci-test-secret"
      BILLING_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: neurokey-pilot/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx vitest run
